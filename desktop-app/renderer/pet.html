<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>长离 · 桌宠</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/pet.css"></head><body class="pet-body">
<div class="pet-stage">
  <section id="pet-bubble" class="pet-bubble" hidden><div class="pet-bubble-head"><span>长离</span><button id="close-bubble" title="收起文字">×</button></div><p id="pet-text"></p><div id="pet-reply-actions" class="pet-bubble-actions"><button id="pet-play">播放</button><button id="pet-continue">继续说</button><button id="pet-view">打开闲叙</button></div></section>
  <section id="care" class="pet-bubble care-bubble" hidden><span class="thought-dots">· · ·</span><p>长离有话想和你说</p><div class="care-countdown"><span id="care-progress"></span></div><div class="care-choices"><button id="care-reject">拒绝</button><span id="care-seconds">10 秒</span><button id="care-accept">接听</button></div></section>
  <section id="pet-editor" class="pet-bubble pet-editor" hidden><div class="pet-bubble-head"><span id="pet-record-label">想对长离说</span><button id="close-editor" title="暂时收起草稿">×</button></div><textarea id="pet-draft" rows="3" placeholder="也可以直接在这里打字…"></textarea><div class="pet-bubble-actions"><button id="pet-record-again">录音</button><button id="pet-send" class="pet-send">发送 ↗</button></div></section>
  <div id="pet-figure" class="pet-figure"><canvas id="pet-canvas" width="1280" height="720" role="img" aria-label="长离桌宠，点击互动，拖动移动" tabindex="0"></canvas><span id="expression-mark" class="expression-mark" hidden>✧</span></div>
  <div class="pet-tools"><button id="pet-record" title="开始或结束录音" aria-label="开始或结束录音"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 10v2a6 6 0 0 0 12 0v-2M12 18v3M9 21h6"/></svg></button><button id="pet-type" title="写一段话" aria-label="输入文字"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v12H10l-5 4v-4H4zM8 8h8M8 12h5"/></svg></button></div>
  <div id="pet-menu" class="pet-menu" hidden><button id="open-chat">打开聊天</button><button id="hide-pet">收起桌宠</button><button id="pet-settings">角色与壁纸设置</button></div>
  <p id="pet-status" class="pet-status" role="status"></p><audio id="pet-audio" controls hidden></audio>
</div><script type="module" src="/pet.mjs"></script></body></html>
